<!doctype html>
<html lang="en" class="dark" style="background: #000; color: #fafafa">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <script>
      // Apply the saved app theme and grey preset before first paint (lib/appearance/appearance.svelte.ts).
      (function () {
        var a = {};
        try {
          a =
            JSON.parse(localStorage.getItem("cryptly.appearance") || "{}") ||
            {};
        } catch (e) {}
        var t =
          a.theme === "light" || a.theme === "dark"
            ? a.theme
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.greys =
          typeof a.greys === "string" ? a.greys : "Stone";
        // App shell pages: until the app mounts (body wrapper still empty), paint the theme's
        // root grey instead of the landing page's black, so light mode doesn't flash dark.
        if (/^\/app\/(project|settings)(\/|$)/.test(location.pathname)) {
          var s = document.createElement("style");
          var empty = "html:not(:has(body > div > :not(script)))";
          s.textContent =
            empty +
            "," +
            empty +
            " body{background:var(--root," +
            (t === "light" ? "#ece9e7" : "#161413") +
            ")!important}";
          document.head.appendChild(s);
        }
      })();
    </script>
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cryptly.dev" />
    <meta property="og:title" content="Cryptly" />
    <meta
      property="og:description"
      content="Ship faster with proper secrets management"
    />
    <meta
      property="og:image"
      content="https://i.ibb.co/gbGXNw6J/cryptly-og.png"
    />
    <meta
      property="og:image:alt"
      content="Cryptly - Ship faster with proper secrets management"
    />
    <meta property="og:site_name" content="Cryptly" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cryptly" />
    <meta
      name="twitter:description"
      content="Ship faster with proper secrets management"
    />
    <meta
      name="twitter:image"
      content="https://i.ibb.co/gbGXNw6J/cryptly-og.png"
    />

    <!-- Logdash web analytics, served first-party by src/routes/_ld -->
    <script
      defer
      src="/_ld/script.js"
      data-site="6acbf37df07d59985c0f7a20"
      data-endpoint="/_ld/events"
    ></script>

    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    style="background: #000; color: #fafafa"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
